# Permalink resolution: given a chain's correlation id, find the invocation to anchor the
# flow view on. Prefer the chain root (the invocation that minted the id); fall back to the
# earliest member if a root row isn't recorded. This is the stable deep-link contract behind
# /flow?correlationId=<id> (what Sentry/Grafana links will use).
query RootByCorrelation($correlationId: String!) {
  roots: invocations(
    where: { correlation_id: { _eq: $correlationId }, is_chain_root: { _eq: true } }
    limit: 1
  ) {
    id
  }
  fallback: invocations(
    where: { correlation_id: { _eq: $correlationId } }
    order_by: { created_at: asc }
    limit: 1
  ) {
    id
  }
}

query InvocationTreeFlow($invocationId: uuid!) {
  invocations_by_pk(id: $invocationId) {
    ...invocationTree
    correlated_invocations(order_by: {created_at: asc}) {
      ...invocationTree
    }
  }
}

# Sibling chains started by the SAME user click. The decoded origin carries a
# `clickId` (identical across every chain one click caused); each chain still keeps
# its own server-minted correlation id. This fetches the OTHER root invocations that
# share a clickId (jsonb containment on context_data), so the canvas can fan one
# user-action node into all of them. `clickMatch` is the containment doc
# `{origin: {clickId: "..."}}`; `since` and `limit` bound it to a recent, small set.
query SiblingChainsByClick($clickMatch: jsonb!, $excludeCorrelationId: String!, $since: timestamptz!, $limit: Int!) {
  invocations(
    where: {
      source_job_id: { _is_null: true }
      context_data: { _contains: $clickMatch }
      correlation_id: { _neq: $excludeCorrelationId }
      created_at: { _gte: $since }
    }
    order_by: { created_at: asc }
    limit: $limit
  ) {
    ...invocationTree
    correlated_invocations(order_by: {created_at: asc}) {
      ...invocationTree
    }
  }
}

fragment invocationTree on invocations {
  id
  source_event_id
  source_function
  source_system
  source_type
  status
  total_duration_ms
  correlation_id
  source_job_id
  created_at
  updated_at

  # Origin node (chain root only): who/when + the decoded client origin.
  source_event_time
  source_user_email
  source_user_role
  context_data

  source_job_execution {
    id
    job_name
    job_function_name
    status
    duration_ms
    correlation_id
    created_at
    updated_at
  }

  event_executions {
    id
    event_name
    detected
    status
    detection_duration_ms
    handler_duration_ms
    correlation_id
    created_at
    updated_at

    job_executions {
      id
      job_name
      job_function_name
      status
      duration_ms
      result
      error_message
      correlation_id
      created_at
      updated_at

      # Jobs that trigger new invocations
      triggered_invocations {
        id
        correlation_id
      }
    }
  }
}