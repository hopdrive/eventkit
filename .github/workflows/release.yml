name: Release

# Changesets-driven release automation (mirrors the sdk repo's publish flow).
#
# On every push to main this runs the changesets action, which does ONE of two
# things depending on whether unreleased changesets exist in .changeset/:
#
#   1. Changesets present  -> open/update a "chore: version packages" PR that
#      consumes them, bumps the version in package.json, and writes CHANGELOG.md.
#      Merging that PR is the human gate on the next release.
#   2. No changesets left (the version PR was just merged) -> run `npm run release`
#      (build + bundle smoke + `changeset publish`) to publish to npm and cut a
#      matching GitHub Release. Versions are never bumped or published by hand.
#
# Release candidates: a manual run with `rc_branch` set publishes that branch's pending
# changesets as a prerelease instead — e.g. 0.8.0-rc.20261012153000 — under the npm dist-tag
# `rc`, so `latest` (what a plain `npm install hopdrive-eventkit` gets) never moves:
#
#   gh workflow run release.yml --repo hopdrive/eventkit -f rc_branch=feat/my-change
#
# The version is what the branch's changesets WILL release (`snapshot.useCalculatedVersion`
# in .changeset/config.json), with `rc.<UTC datetime>` appended so successive RCs sort in
# order. Nothing is committed, tagged, or released on GitHub; re-run it after each push to
# cut the next RC. It lives in this file, not its own, because npm Trusted Publishing
# authorizes ONE workflow file — a second file would need its own trusted publisher on npmjs.
#
# Auth: npm Trusted Publishing via GitHub OIDC — NO stored npm token. npmjs must
# have a trusted publisher configured for this package pointing at
# `hopdrive/eventkit` + this workflow file (`release.yml`). Because the repo is
# public, publishes also carry build provenance (the "signed on GitHub Actions"
# badge on npm).

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-trigger of the release (e.g. to retry a failed publish), or an RC
    inputs:
      rc_branch:
        description: 'Publish a release candidate from this branch. Leave empty to re-run the normal release.'
        required: false
        type: string
        default: ''

# Never let two release runs race the version PR / publish. RCs queue per branch, apart from
# releases, so cutting one never displaces a pending release run (or vice versa).
concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.rc_branch || 'release' }}

jobs:
  release:
    if: ${{ github.event_name == 'push' || inputs.rc_branch == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump, push tags, create releases
      pull-requests: write # open/update the "chore: version packages" PR
      id-token: write # OIDC token for npm Trusted Publishing (no stored secret)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm 11.x, which supports OIDC Trusted Publishing +
          # provenance natively. Node 20's bundled npm is 10.x and a global
          # `npm i -g npm@latest` did NOT reliably replace the npm the publish
          # step used (it still ENEEDAUTH'd), so pin the runtime instead.
          node-version: 24
          cache: npm
          # No registry-url/token wiring: leaving setup-node's .npmrc unwritten
          # keeps the publish on the OIDC path (an empty _authToken line would
          # shadow trusted publishing). The registry comes from package.json
          # "publishConfig".

      # Use Node 24's bundled npm as-is (11.5.1+, which supports OIDC Trusted
      # Publishing + provenance natively). We deliberately do NOT `npm install -g
      # npm@latest` here: reinstalling npm over the bundled copy drops some of npm's
      # own *bundled* transitive deps — notably `sigstore`, which `libnpmpublish`
      # loads to build the provenance attestation under `NPM_CONFIG_PROVENANCE`. That
      # self-update is what broke the 0.5.0 publish ("Cannot find module 'sigstore'"
      # from libnpmpublish/lib/provenance.js). The pristine bundled npm ships sigstore
      # intact. Print the versions so the publish npm stays auditable.
      - name: Print npm/node versions
        run: |
          node -v
          npm -v

      - run: npm ci

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version # `changeset version` — bump + changelog for the PR
          publish: npm run release # build + smoke + `changeset publish`
          title: 'chore: version packages'
          commit: 'chore: version packages'
          createGithubReleases: true
        env:
          # Lets the action open the version PR and create GitHub Releases.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publish auth is GitHub OIDC (npm Trusted Publishing) — no NPM token.
          # Emit build provenance (repo is public, so it's publicly verifiable).
          NPM_CONFIG_PROVENANCE: 'true'
          HUSKY: '0'

  release-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rc_branch != '' }}
    runs-on: ubuntu-latest
    # The branch name reaches the scripts through the environment, never interpolated into
    # them, so a branch name can't inject shell.
    env:
      RC_BRANCH: ${{ inputs.rc_branch }}
    permissions:
      contents: read # nothing is pushed: no version commit, no tag, no GitHub Release
      id-token: write # OIDC token for npm Trusted Publishing (same publisher as the release)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rc_branch }}

      # Same runtime as the release job, for the same reason (npm 11 + intact sigstore).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Print npm/node versions
        run: |
          node -v
          npm -v

      - run: npm ci

      - name: Check the branch can cut a release candidate
        run: |
          # Without useCalculatedVersion, changesets versions a snapshot 0.0.0-rc-…, which says
          # nothing about the release it previews. Branches cut before RC support need a rebase.
          if ! jq -e '.snapshot.useCalculatedVersion == true' .changeset/config.json > /dev/null; then
            echo "::error::$RC_BRANCH predates RC support (.changeset/config.json has no snapshot.useCalculatedVersion). Rebase it on main."
            exit 1
          fi
          # A snapshot with no pending changesets leaves the version unchanged, and the publish
          # would then try to overwrite the current release.
          if ! ls .changeset/*.md 2>/dev/null | grep -v '/README.md$' > /dev/null; then
            echo "::error::$RC_BRANCH has no pending changesets, so there is nothing to release. Add one with 'npx changeset'."
            exit 1
          fi

      - name: Version the release candidate
        id: version
        run: |
          npx changeset version --snapshot rc
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-rc.*) ;;
            *) echo "::error::Expected an rc prerelease version, got $VERSION."; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Same gates as `npm run release`, minus the stable publish.
      - name: Build, bundle smoke, console
        run: npm run build && npm run smoke:bundle && npm run build:console

      - name: Publish to npm under the rc dist-tag
        run: npx changeset publish --tag rc --no-git-tag
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          HUSKY: '0'

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Published hopdrive-eventkit@$VERSION"
            echo ""
            echo "From \`$RC_BRANCH\` at \`$(git rev-parse --short HEAD)\`, under the npm dist-tag \`rc\` (\`latest\` is unchanged)."
            echo ""
            echo '```bash'
            echo "npm install hopdrive-eventkit@$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
